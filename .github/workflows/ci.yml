name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sync
        run: uv sync --extra dev
      - name: Archive resolved lock for pull-request maintenance
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-uv-lock
          path: uv.lock
          retention-days: 1
      - name: Unit and contract tests
        run: uv run --extra dev pytest
      - name: CLI fixture inspection
        run: uv run grounded-motion inspect-video tests/fixtures/source.mp4
      - name: In-memory MCP smoke
        run: uv run python scripts/mcp_smoke.py
      - name: STDIO MCP smoke
        run: uv run python scripts/stdio_smoke.py
      - name: Streamable HTTP MCP smoke
        run: uv run python scripts/http_smoke.py
      - name: Lint
        run: uv run ruff check src tests scripts

  container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned inference appliance
        run: docker build --build-arg "GROUNDED_MOTION_REVISION=${GITHUB_SHA}" --tag grounded-motion-ci .
      - name: Verify baked inference imports and checkpoint
        run: |
          docker run --rm --entrypoint python3 grounded-motion-ci -c "import hashlib, pathlib, mmcv, mmengine, mmpose, numpy, torch, xtcocotools._mask; from mmpose.apis import MMPoseInferencer; assert numpy.__version__=='1.26.4', numpy.__version__; p=pathlib.Path('/models/rtmw-x_simcc-cocktail14_pt-ucoco_270e-384x288-f840f204_20231122.pth'); assert hashlib.sha256(p.read_bytes()).hexdigest()=='f840f2044fe46cb3821b7cea86be83e1f6cba406ccd28f5475ac010412dcda95'; print({'torch':torch.__version__,'cuda':torch.version.cuda,'mmcv':mmcv.__version__,'mmengine':mmengine.__version__,'mmpose':mmpose.__version__})"

