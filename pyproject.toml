[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grounded-motion-mcp"
version = "0.1.0"
description = "Deterministic whole-body motion tracking and audit tools exposed through MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Drew Clarke" }]
dependencies = [
  "google-auth>=2.40,<3",
  "google-cloud-storage>=3.4,<4",
  "mcp>=2.0.0,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
inference = [
  "mmpose==1.3.2",
  "mmengine==0.10.7",
  "openmim==0.3.9",
  "torch==2.1.0",
  "torchvision==0.16.0",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
grounded-motion = "grounded_motion_mcp.cli:main"
grounded-motion-mcp = "grounded_motion_mcp.server:main"
grounded-motion-canary-worker = "grounded_motion_mcp.vanguard_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_motion_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv.extra-build-dependencies]
chumpy = ["pip", "setuptools"]
